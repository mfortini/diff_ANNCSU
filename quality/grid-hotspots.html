define({id: "5162dd65", inputs: ["d3"], outputs: ["formatNumber","downloadCSV"], body: (d3) => {
const formatNumber = (value) => {
  const n = Number(value);
  if (!Number.isFinite(n)) return value ?? "-";
  return Number.isInteger(n) ? d3.format(",")(n) : d3.format(",.5f")(n);
};

function downloadCSV(rows, filename) {
  if (!rows?.length) return;
  const cols = Object.keys(rows[0]);
  const escape = (value) => {
    const s = value == null ? "" : String(value);
    return s.includes(",") || s.includes('"') || s.includes("\n")
      ? `"${s.replace(/"/g, '""')}"`
      : s;
  };
  const csv = [cols.join(","), ...rows.map((row) => cols.map((col) => escape(row[col])).join(","))].join("\n");
  const blob = new Blob([csv], {type: "text/csv"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}
return {formatNumber,downloadCSV};
}});

define({id: "f874f29e", inputs: ["filteredCells","html","display","hotspotsPmtilesUrls","gridRowsPointFilter","hotspotPointPaint","maplibregl","gridCellFilterForRow","hotspotState","d3","bindHotspotShareUrl","normalizeIstat","invalidation"], body: async (filteredCells,html,display,hotspotsPmtilesUrls,gridRowsPointFilter,hotspotPointPaint,maplibregl,gridCellFilterForRow,hotspotState,d3,bindHotspotShareUrl,normalizeIstat,invalidation) => {
if (filteredCells.length) {
  const wrapper = html`<div style="position:relative;height:560px;border:1px solid #d4d4d8;border-radius:8px;overflow:hidden;background:#fff"></div>`;
  const banner = html`<div style="position:absolute;left:12px;top:12px;z-index:2;max-width:min(520px,calc(100% - 24px));padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.94);box-shadow:0 8px 24px rgba(15,23,42,0.14);font:12px/1.4 sans-serif;color:#111827">
    <strong>Nessuna cella selezionata</strong><br>
    <span style="color:#4b5563">Clicca un centro o un punto per vedere il dettaglio qui.</span>
  </div>`;
  const container = html`<div style="position:absolute;inset:0"></div>`;
  wrapper.append(banner, container);
  display(wrapper);
  await new Promise(requestAnimationFrame);

  const rows = filteredCells
    .map((d) => ({
      ...d,
      codice_istat: String(d.codice_istat ?? "").padStart(6, "0"),
      center_lon: Number(d.center_lon),
      center_lat: Number(d.center_lat),
      point_count: Number(d.point_count) || 0
    }))
    .filter((d) => Number.isFinite(d.center_lon) && Number.isFinite(d.center_lat));

  const sourceIds = hotspotsPmtilesUrls.map((_, index) => `hotspots-${String(index).padStart(2, "0")}`);
  const layerIds = sourceIds.map((id) => `${id}-grid-points`);
  const vectorSources = Object.fromEntries(
    hotspotsPmtilesUrls.map((url, index) => [sourceIds[index], {type: "vector", url: `pmtiles://${url}`}])
  );
  const pointFilter = gridRowsPointFilter(rows);
  const pointLayers = layerIds.map((layerId, index) => ({
    id: layerId,
    type: "circle",
    source: sourceIds[index],
    "source-layer": "hotspots_points",
    filter: pointFilter,
    paint: hotspotPointPaint
  }));

  const map = new maplibregl.Map({
    container,
    center: [12.5, 42.5],
    zoom: 5,
    minZoom: 4,
    maxZoom: 20,
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: ["https://a.tile.openstreetmap.org/{z}/{x}/{y}.png"],
          tileSize: 256,
          attribution: "&copy; OpenStreetMap contributors",
          maxzoom: 19
        },
        ...vectorSources,
        cellCenters: {
          type: "geojson",
          data: {
            type: "FeatureCollection",
            features: rows.map((row) => ({
              type: "Feature",
              geometry: {type: "Point", coordinates: [row.center_lon, row.center_lat]},
              properties: row
            }))
          }
        }
      },
      layers: [
        {id: "osm", type: "raster", source: "osm"},
        ...pointLayers,
        {
          id: "cell-centers",
          type: "circle",
          source: "cellCenters",
          paint: {
            "circle-color": "#0f766e",
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 5, 4, 10, 5.5, 14, 7],
            "circle-opacity": 0.9,
            "circle-stroke-color": "#ffffff",
            "circle-stroke-width": 1.2
          }
        }
      ]
    }
  });
  await new Promise((resolve) => map.once("load", resolve));

  const hoverPopup = new maplibregl.Popup({closeButton: false, closeOnClick: false, offset: 10});
  const pointBoundsForRow = (row) => {
    const features = sourceIds.flatMap((sourceId) =>
      map.querySourceFeatures(sourceId, {
        sourceLayer: "hotspots_points",
        filter: gridCellFilterForRow(row)
      })
    );
    const coords = features.map((feature) => feature.geometry?.coordinates).filter((coords) => Array.isArray(coords));
    if (!coords.length) return null;
    return coords.reduce((acc, coords) => {
      acc.extend(coords);
      return acc;
    }, new maplibregl.LngLatBounds(coords[0], coords[0]));
  };
  hotspotState.focus = (row) => {
    banner.innerHTML = `
      <strong>${row.comune} (${row.pro_com})</strong><br>
      ISTAT: ${row.codice_istat}<br>
      Punti elenco: ${d3.format(",")(Number(row.point_count) || 0)}<br>
      Cella: ${row.cell_id}<br>
      Regola: ${row.anomaly_rule}<br>
      P99: ${row.global_p99 ?? "-"}<br>
      Lon/Lat centro: ${Number(row.center_lon).toFixed(6)}, ${Number(row.center_lat).toFixed(6)}
    `;
    map.flyTo({center: [row.center_lon, row.center_lat], zoom: 18, duration: 800});
    map.once("idle", () => {
      const bounds = pointBoundsForRow(row);
      if (bounds) map.fitBounds(bounds, {padding: 60, maxZoom: 20, duration: 400});
    });
    shareUrl.syncFragment(row);
  };

  const shareUrl = bindHotspotShareUrl({
    keys: ["istat", "cell"],
    rowToFragment: (row) => ({
      istat: normalizeIstat(row.codice_istat),
      cell: row.cell_id
    }),
    findRow: (data) => rows.find((row) =>
      normalizeIstat(row.codice_istat) === normalizeIstat(data.istat) &&
      String(row.cell_id) === String(data.cell)
    ),
    invalidation
  });
  shareUrl.setFocusHandler((row) => hotspotState.focus(row));

  const bounds = rows.reduce((acc, row) => {
    acc.extend([row.center_lon, row.center_lat]);
    return acc;
  }, new maplibregl.LngLatBounds([rows[0].center_lon, rows[0].center_lat], [rows[0].center_lon, rows[0].center_lat]));
  map.fitBounds(bounds, {padding: 40, maxZoom: 13});
  shareUrl.applyFragment();

  for (const layerId of layerIds) {
    map.on("mouseenter", layerId, () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", layerId, () => { map.getCanvas().style.cursor = ""; });
    map.on("click", layerId, (event) => {
      const properties = event.features?.[0]?.properties;
      const row = rows.find((candidate) =>
        normalizeIstat(candidate.codice_istat) === normalizeIstat(properties?.codice_istat) &&
        String(candidate.cell_id) === String(properties?.grid_cell_id)
      );
      if (row) hotspotState.focus(row);
    });
  }
  map.on("mouseenter", "cell-centers", () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "cell-centers", () => {
    map.getCanvas().style.cursor = "";
    hoverPopup.remove();
  });
  map.on("mousemove", "cell-centers", (event) => {
    const properties = event.features?.[0]?.properties;
    if (!properties) return;
    hoverPopup
      .setLngLat(event.lngLat)
      .setHTML(`<strong>${properties.comune}</strong><br><small>Cella ${properties.cell_id}, ${d3.format(",")(Number(properties.point_count) || 0)} punti</small>`)
      .addTo(map);
  });
  map.on("click", "cell-centers", (event) => {
    const properties = event.features?.[0]?.properties;
    if (!properties) return;
    hotspotState.focus({
      ...properties,
      center_lon: Number(properties.center_lon),
      center_lat: Number(properties.center_lat),
      point_count: Number(properties.point_count) || 0
    });
  });

  invalidation.then(() => {
    hoverPopup.remove();
    map.remove();
  });
}
}});
